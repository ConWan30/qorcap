[package]
name = "qorcap"
version = "0.3.27"
edition = "2021"
license = "MIT"
description = "Lean, self-healing USB capture-card recorder for Windows (ffmpeg dshow backend)"
rust-version = "1.96"

[dependencies]
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
ctrlc = "3"
sha2 = "0.10"
libc = "0.2"
# Content Credentials. default-features is off so the vendored OpenSSL backend
# and the HTTP client (remote manifests, TSA, OCSP) are not compiled.
# `rust_native_crypto` is pure Rust (p256 / ed25519-dalek) and is what keeps
# the Windows x64 build free of a system OpenSSL or a vendored C toolchain.
c2pa = { version = "0.91.4", default-features = false, features = ["rust_native_crypto"] }
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }

[target.'cfg(windows)'.dependencies]
# Pure-Rust Windows HID backend (no C toolchain needed); used only to read the DualSense over USB.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[features]
# Enables the `testpattern` pseudo-device (ffmpeg lavfi testsrc + sine) so the
# full pipeline can be exercised without a capture card.
test-pattern = []
default = ["test-pattern"]

[profile.release]
opt-level = 3
lto = true
strip = true
