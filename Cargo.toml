[package]
name = "qorcap"
version = "0.3.13"
edition = "2021"
license = "MIT"
description = "Lean, self-healing USB capture-card recorder for Windows (ffmpeg dshow backend)"

[dependencies]
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
ctrlc = "3"
sha2 = "0.10"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Pure-Rust Windows HID backend (no C toolchain needed); used only to read the DualSense over USB.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[features]
# Enables the `testpattern` pseudo-device (ffmpeg lavfi testsrc + sine) so the
# full pipeline can be exercised without a capture card.
test-pattern = []
default = ["test-pattern"]

[profile.release]
opt-level = 3
lto = true
strip = true
