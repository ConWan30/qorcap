[package]
name = "qorcap"
version = "0.3.33"
edition = "2021"
license = "MIT"
description = "Lean, self-healing USB capture-card recorder for Windows (ffmpeg dshow backend)"
rust-version = "1.96"

[dependencies]
clap = { version = "4", features = ["derive"] }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
ctrlc = "3"
sha2 = "0.10"
libc = "0.2"
# Red-team receipts are signed the same way QorTime signs: Ed25519 over JCS with the
# signatures object removed. default-features off so key generation stays on a fixed seed.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["alloc", "std", "zeroize", "fast"] }
# Device attestation: ECDSA P-256, and RSA-2048 PKCS#1 SHA-256 when the TPM has no P-256.
# ring is already in the build for the C2PA certificate. base64 is the SPKI and signature encoding.
ring = "0.17.14"
base64 = "0.22.1"
# Content Credentials. default-features is off so the vendored OpenSSL backend
# and the HTTP client (remote manifests, TSA, OCSP) are not compiled.
# `rust_native_crypto` is pure Rust (p256 / ed25519-dalek) and is what keeps
# the Windows x64 build free of a system OpenSSL or a vendored C toolchain.
c2pa = { version = "0.91.4", default-features = false, features = ["rust_native_crypto"] }
rcgen = { version = "0.13.2", default-features = false, features = ["pem", "ring"] }

[target.'cfg(windows)'.dependencies]
# Pure-Rust Windows HID backend (no C toolchain needed); used only to read the DualSense over USB.
hidapi = { version = "2.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
# Pure-Rust xz reader for the haptic regression fixtures (tests/fixtures/haptics).
lzma-rs = "0.3"

[features]
# Enables the `testpattern` pseudo-device (ffmpeg lavfi testsrc + sine) so the
# full pipeline can be exercised without a capture card.
test-pattern = []
default = ["test-pattern"]

[profile.release]
opt-level = 3
lto = true
strip = true
